<title>Códice do Random Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #e6e3dd;
  --panel: #f5f3ef;
  --panel-2: #ebe7e0;
  --ink: #1f1b17;
  --muted: #6d655b;
  --line: #cdc6bb;
  --accent: #8a561c;
  --accent-ink: #fff8ee;
  --slot: #221e1a;
  --q-common: #4a443d;
  --q-uncommon: #2e8a3c;
  --q-rare: #2f5fc4;
  --q-unique: #a8740a;
  --pending: #c26a12;
  --shadow: 0 10px 40px rgba(20, 16, 12, .18);
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12100e;
    --panel: #1c1916;
    --panel-2: #24201c;
    --ink: #ebe4d8;
    --muted: #9b9185;
    --line: #3a332b;
    --accent: #d39b4c;
    --accent-ink: #1a1208;
    --slot: #0b0a09;
    --q-common: #d9d2c6;
    --q-uncommon: #5fd36b;
    --q-rare: #6e9bff;
    --q-unique: #f2c14e;
    --pending: #f0923a;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12100e;
  --panel: #1c1916;
  --panel-2: #24201c;
  --ink: #ebe4d8;
  --muted: #9b9185;
  --line: #3a332b;
  --accent: #d39b4c;
  --accent-ink: #1a1208;
  --slot: #0b0a09;
  --q-common: #d9d2c6;
  --q-uncommon: #5fd36b;
  --q-rare: #6e9bff;
  --q-unique: #f2c14e;
  --pending: #f0923a;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--body);
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 18px 12px;
  display: grid; gap: 12px;
}
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; justify-content: space-between; }
h1 { font: 400 clamp(28px, 4vw, 40px)/1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 small { font: 500 14px/1 var(--body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-left: 10px; }
.status { font-size: 14px; color: var(--muted); }
.nav-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 8px; border: 1px solid var(--line); }
.tabs button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 6px;
  font: 400 18px/1 var(--display); color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.tabs .count { font: 500 12px/1 var(--mono); color: var(--muted); margin-left: 6px; }
.pending-pill {
  border: 1px solid var(--pending); color: var(--pending); background: transparent;
  border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px;
}
.pending-pill[aria-pressed="true"] { background: var(--pending); color: var(--accent-ink); }
.pending-pill[hidden] { display: none; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding-block: 14px 4px; }
.filters input[type="search"], .filters select {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0;
}
.filters input[type="search"] { flex: 1 1 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 4px 11px; font-size: 14px; color: var(--muted);
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--panel-2); }
.hint { color: var(--muted); font-size: 14px; margin: 6px 0 14px; max-width: 75ch; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center;
  text-align: left; width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  position: relative;
}
.card:hover { border-color: var(--accent); }
.card .name { font-weight: 700; line-height: 1.15; }
.card .pt { color: var(--muted); font-size: 14px; line-height: 1.2; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 13px/1.3 var(--mono); color: var(--muted); margin-top: 4px; }
.card .main-stat { color: var(--ink); }
.card .dot {
  position: absolute; top: 8px; right: 8px; font: 700 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase;
  color: var(--pending);
}
.q-common .name { color: var(--q-common); }
.q-uncommon .name { color: var(--q-uncommon); }
.q-rare .name { color: var(--q-rare); }
.q-unique .name { color: var(--q-unique); }

.slot {
  width: 52px; height: 52px; border-radius: 6px; background-color: var(--slot);
  border: 1px solid var(--line); flex: none;
  display: grid; place-items: center; overflow: hidden;
}
.icon { width: 48px; height: 48px; background-image: url("icons.png"); background-size: 384px auto; background-repeat: no-repeat; }
.portrait-slot { width: 76px; height: 76px; background-color: var(--slot); }
.portrait { width: 72px; height: 72px; background-image: url("enemies.png"); background-size: 576px auto; background-repeat: no-repeat; }
.grade { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; border: 1px solid currentColor; }
.grade.elite { color: var(--q-rare); }
.grade.boss { color: var(--q-unique); }
.grade.normal { color: var(--muted); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21;
  width: min(480px, 100%); background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: var(--shadow); overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px; align-content: start;
}
.drawer-head { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.drawer-head h2 { font: 400 24px/1.1 var(--display); margin: 0; text-wrap: balance; }
.drawer-head .sub { color: var(--muted); font-size: 14px; }
.close { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; width: 36px; height: 36px; font-size: 20px; line-height: 1; }
fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; display: grid; gap: 10px; }
legend { font: 400 16px/1 var(--display); padding: 0 6px; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.f.wide { grid-column: 1 / -1; }
label.f input, label.f select, label.f textarea, .bonus-row select, .bonus-row input {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; color: var(--ink); width: 100%;
  font: 15px/1.2 var(--body);
}
label.f input[type="number"], .bonus-row input { font-family: var(--mono); font-variant-numeric: tabular-nums; }
textarea { min-height: 72px; resize: vertical; }
.bonus-list { display: grid; gap: 6px; }
.bonus-row { display: grid; grid-template-columns: 1fr 90px 36px; gap: 6px; }
.bonus-row button, .add-bonus { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; }
.add-bonus { padding: 6px 10px; justify-self: start; font-size: 14px; }
.readonly { font: 13px/1.5 var(--mono); color: var(--muted); display: grid; gap: 2px; }
.preview { display: grid; gap: 8px; }
.preview .row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.preview .row b { font-family: var(--mono); font-weight: 500; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 8px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.save-msg { font-size: 14px; color: var(--muted); }
.save-msg.err { color: #d04a3a; }

/* loot */
.loot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.loot-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 12px; align-content: start; }
.loot-card h3 { font: 400 22px/1 var(--display); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); }
.bar span { display: block; height: 100%; }
.legend { display: grid; gap: 3px; font-size: 14px; }
.legend .row { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: block; }
.legend b { font-family: var(--mono); font-weight: 500; }
.c-nothing { background: var(--line); }
.c-gold { background: #b08d3a; }
.c-potion { background: #b0443a; }
.c-common { background: var(--q-common); }
.c-uncommon { background: var(--q-uncommon); }
.c-rare { background: var(--q-rare); }
.c-unique { background: var(--q-unique); }
.empty { color: var(--muted); padding: 30px 0; }
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .bonus-row { grid-template-columns: 1fr 76px 36px; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="title-row">
      <h1>Códice <small>Random Dungeon</small></h1>
      <div class="status" id="status">Carregando o catálogo…</div>
    </div>
    <div class="nav-row">
      <div class="tabs" role="tablist" aria-label="Seções">
        <button role="tab" id="tab-items" aria-selected="true" data-tab="items">Itens<span class="count" id="count-items"></span></button>
        <button role="tab" id="tab-enemies" aria-selected="false" data-tab="enemies">Monstros<span class="count" id="count-enemies"></span></button>
        <button role="tab" id="tab-loot" aria-selected="false" data-tab="loot">Loot</button>
      </div>
      <button class="pending-pill" id="pending-pill" aria-pressed="false" hidden></button>
    </div>
  </header>

  <main id="main"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title"></aside>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- vocab
  var BAND = { common: "Comum", uncommon: "Incomum", rare: "Raro", unique: "Único" };
  var KIND = { weapon: "Armas", armor: "Armaduras", shield: "Escudos", accessory: "Acessórios" };
  var DMG = { melee: "corpo a corpo", ranged: "distância", ment: "magia" };
  var GRADE = { normal: "Normal", elite: "Elite", boss: "Chefe" };
  var STAT = {
    hp: "Vida", mp: "Mana", hp_regen: "Regen. de vida", mp_regen: "Regen. de mana",
    crit: "Crítico %", accuracy: "Precisão", avoidance: "Esquiva", poise: "Equilíbrio",
    absorb_min: "Absorção mín.", absorb_max: "Absorção máx.",
    physical: "Físico", offense: "Ataque", mental: "Mental", defense: "Defesa",
    fire_resist: "Res. fogo %", ice_resist: "Res. gelo %", lightning_resist: "Res. raio %", dark_resist: "Res. trevas %",
    dmg_fire_min: "Fogo mín.", dmg_fire_max: "Fogo máx.", dmg_ice_min: "Gelo mín.", dmg_ice_max: "Gelo máx.",
    dmg_lightning_min: "Raio mín.", dmg_lightning_max: "Raio máx.", dmg_dark_min: "Trevas mín.", dmg_dark_max: "Trevas máx.",
    xp_gain: "XP bônus %", item_find: "Achar itens %", currency_find: "Achar ouro %"
  };
  var RESIST = ["fire_resist", "ice_resist", "lightning_resist", "dark_resist"];
  var TINTS = ["", "iron", "silver", "bluesteel", "adamantite", "hardened", "forest", "blessed", "ice", "gold", "crimson",
    "ashen", "shadow", "fire", "venom", "rust", "royal", "blood", "orc", "steel", "frost", "arcane", "dusk", "bone",
    "ghoul", "mummy", "ancient", "ghost", "spectral", "wraith", "deathknight", "sand", "infernal"];
  var ITEM_FIELDS = ["name", "name_pt", "level", "band", "dmg_min", "dmg_max", "abs_min", "abs_max", "price", "tint", "bonuses", "slayer", "classes", "notes"];
  var SLAYER = { undead: "Mortos-vivos", demon: "Demônios", greenskin: "Peles-verdes", beast: "Feras" };
  var CLASSES = [["Warrior", "Guerreiro"], ["Rogue", "Ladino"], ["Cleric", "Clérigo"], ["Mage", "Mago"]];
  var ENEMY_FIELDS = ["name", "name_pt", "ek_level", "grade", "hp_mult", "dmg_mult", "tint", "resists", "notes"];
  var LOOT_FIELDS = ["gold", "potion", "common", "uncommon", "rare", "unique", "gold_qty", "gold_qty_per_level", "level_below", "level_above", "drops_min", "drops_max", "notes"];

  // ---------------------------------------------------------------- state
  var state = {
    tab: "items",
    base: { items: {}, enemies: {}, loot: {} },   // catalog.json (baseline / revert / fallback)
    live: { items: {}, enemies: {}, loot: {} },   // shared database, when available
    db: null, dbReady: false, readOnly: false,
    q: "", kind: "all", band: "all", family: "all", grade: "all", sort: "level", pendingOnly: false,
    open: null
  };

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function rows(coll) {
    var src = Object.keys(state.live[coll]).length ? state.live[coll] : state.base[coll];
    return Object.keys(src).map(function (k) { return src[k]; });
  }
  function get(coll, id) {
    return state.live[coll][id] || state.base[coll][id];
  }
  function parseBonuses(s) {
    return (s || "").split(";").filter(Boolean).map(function (p) { var kv = p.split(":"); return { k: kv[0], v: Number(kv[1]) }; });
  }
  function fmtBonuses(list) { return list.filter(function (b) { return b.k; }).map(function (b) { return b.k + ":" + b.v; }).join(";"); }
  function bonusText(b) { return (STAT[b.k] || b.k) + " " + (b.v > 0 ? "+" : "") + b.v; }
  Object.keys({ undead: 1, demon: 1, greenskin: 1, beast: 1 }).forEach(function (k) { STAT[k] = "Dano % vs " + ({ undead: "mortos-vivos", demon: "demônios", greenskin: "peles-verdes", beast: "feras" })[k]; });

  // ---------------------------------------------------------------- items
  function iconStyle(i) { return "background-position:" + (-(i % 8) * 48) + "px " + (-Math.floor(i / 8) * 48) + "px"; }
  function portraitStyle(i) { return "background-position:" + (-(i % 8) * 72) + "px " + (-Math.floor(i / 8) * 72) + "px"; }
  function itemMainStat(it) {
    if (it.dmg_min != null) return "Dano " + it.dmg_min + "–" + it.dmg_max;
    if (it.abs_min != null) return "Armadura " + it.abs_min + "–" + it.abs_max;
    var b = parseBonuses(it.bonuses)[0];
    return b ? bonusText(b) : "";
  }

  function renderItems(main) {
    var list = rows("items");
    var filters = el("div", { class: "filters" }, [
      el("input", { type: "search", id: "q-items", placeholder: "Buscar por nome (EN ou PT) ou id", value: state.q,
        oninput: function (e) { state.q = e.target.value; renderList(); } }),
      chipGroup("kind", [["all", "Tudo"]].concat(Object.keys(KIND).map(function (k) { return [k, KIND[k]]; }))),
      chipGroup("band", [["all", "Toda raridade"]].concat(Object.keys(BAND).map(function (k) { return [k, BAND[k]]; }))),
      el("select", { id: "sort-items", "aria-label": "Ordenar", onchange: function (e) { state.sort = e.target.value; renderList(); } },
        [["level", "Por nível"], ["name", "Por nome"], ["power", "Por dano/armadura"]].map(function (o) {
          var opt = el("option", { value: o[0], text: o[1] }); if (o[0] === state.sort) opt.selected = true; return opt;
        }))
    ]);
    var grid = el("div", { class: "grid", id: "grid" });
    main.appendChild(filters);
    main.appendChild(el("p", { class: "hint", text: "Clique num item para editar. O que você salvar fica marcado como pendente até o Claude aplicar no jogo (planilhas em tools/ek_data e regeneração)." }));
    main.appendChild(grid);

    function renderList() {
      var q = state.q.trim().toLowerCase();
      var shown = list.filter(function (it) {
        if (state.pendingOnly && !it.pending) return false;
        if (state.kind !== "all" && it.kind !== state.kind) return false;
        if (state.band !== "all" && it.band !== state.band) return false;
        if (q && (it.name + " " + it.name_pt + " " + it.id + " " + it.type).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      shown.sort(function (a, b) {
        if (state.sort === "name") return a.name_pt.localeCompare(b.name_pt);
        if (state.sort === "power") return ((b.dmg_max || b.abs_max || 0) - (a.dmg_max || a.abs_max || 0));
        return (a.level - b.level) || (a.id - b.id);
      });
      grid.textContent = "";
      if (!shown.length) grid.appendChild(el("p", { class: "empty", text: "Nenhum item com esses filtros." }));
      shown.forEach(function (it) {
        grid.appendChild(el("button", { class: "card q-" + it.band, type: "button", onclick: function () { openItem(it.id); } }, [
          el("span", { class: "slot" }, [el("span", { class: "icon", style: iconStyle(it.icon) })]),
          el("span", {}, [
            el("div", { class: "name", text: it.name_pt || it.name }),
            el("div", { class: "pt", text: it.name }),
            el("div", { class: "meta" }, [
              el("span", { text: "Nv " + it.level }),
              el("span", { class: "main-stat", text: itemMainStat(it) }),
              el("span", { text: BAND[it.band] || it.band })
            ])
          ]),
          it.pending ? el("span", { class: "dot", text: "pendente" }) : null
        ]));
      });
    }
    renderList();
  }

  function chipGroup(key, opts) {
    return el("div", { class: "chips", role: "group" }, opts.map(function (o) {
      return el("button", { class: "chip", type: "button", "aria-pressed": String(state[key] === o[0]),
        onclick: function () { state[key] = o[0]; render(); } }, [o[1]]);
    }));
  }

  // ---------------------------------------------------------------- enemies
  function enemyAt(e, lvl) {
    var hp = Math.round((e.base_hp + e.base_hp_per_level * (lvl - 1)) * e.hp_mult);
    var dmin = Math.round((e.base_dmg_min + e.base_dmg_per_level * (lvl - 1)) * e.dmg_mult);
    var dmax = Math.round((e.base_dmg_max + e.base_dmg_per_level * (lvl - 1)) * e.dmg_mult);
    return { hp: hp, dmin: dmin, dmax: dmax };
  }

  function renderEnemies(main) {
    var list = rows("enemies");
    var families = {};
    list.forEach(function (e) { families[e.family] = true; });
    var famSel = el("select", { id: "family", "aria-label": "Família", onchange: function (e) { state.family = e.target.value; renderList(); } },
      [["all", "Todas as famílias"]].concat(Object.keys(families).sort().map(function (f) { return [f, f]; })).map(function (o) {
        var opt = el("option", { value: o[0], text: o[1] }); if (o[0] === state.family) opt.selected = true; return opt;
      }));
    main.appendChild(el("div", { class: "filters" }, [
      el("input", { type: "search", id: "q-enemies", placeholder: "Buscar monstro", value: state.q,
        oninput: function (e) { state.q = e.target.value; renderList(); } }),
      famSel,
      chipGroup("grade", [["all", "Todos"], ["normal", "Normais"], ["elite", "Elite"], ["boss", "Chefes"]])
    ]));
    main.appendChild(el("p", { class: "hint", text: "Vida e dano mostrados no nível 5. Os inimigos escalam com o nível do herói (masmorra) ou da onda (run); a força é o multiplicador sobre o modelo base." }));
    var grid = el("div", { class: "grid", id: "grid" });
    main.appendChild(grid);

    function renderList() {
      var q = state.q.trim().toLowerCase();
      var shown = list.filter(function (e) {
        if (state.pendingOnly && !e.pending) return false;
        if (state.family !== "all" && e.family !== state.family) return false;
        if (state.grade !== "all" && e.grade !== state.grade) return false;
        if (q && (e.name + " " + e.name_pt + " " + e.family).toLowerCase().indexOf(q) < 0) return false;
        return true;
      }).sort(function (a, b) { return (a.ek_level - b.ek_level) || a.name.localeCompare(b.name); });
      grid.textContent = "";
      if (!shown.length) grid.appendChild(el("p", { class: "empty", text: "Nenhum monstro com esses filtros." }));
      shown.forEach(function (e) {
        var s = enemyAt(e, 5);
        grid.appendChild(el("button", { class: "card", type: "button", onclick: function () { openEnemy(e.id); } }, [
          el("span", { class: "slot portrait-slot" }, [el("span", { class: "portrait", style: portraitStyle(e.portrait) })]),
          el("span", {}, [
            el("div", { class: "name", text: e.name_pt || e.name }),
            el("div", { class: "pt", text: e.name + " · " + e.family }),
            el("div", { class: "meta" }, [
              el("span", { class: "grade " + e.grade, text: GRADE[e.grade] || e.grade }),
              el("span", { text: "EK nv " + e.ek_level }),
              el("span", { class: "main-stat", text: "Vida " + s.hp }),
              el("span", { text: "Dano " + s.dmin + "–" + s.dmax })
            ])
          ]),
          e.pending ? el("span", { class: "dot", text: "pendente" }) : null
        ]));
      });
    }
    renderList();
  }

  // ---------------------------------------------------------------- loot
  var BANDS = [["unique", "Único"], ["rare", "Raro"], ["uncommon", "Incomum"], ["common", "Comum"], ["potion", "Poção"], ["gold", "Ouro"]];
  function lootOdds(g) {
    // Flare: one roll 0-100, the eligible entry with the SMALLEST chance wins,
    // so each band gets (its chance - the next smaller chance).
    var out = [], prev = 0;
    BANDS.forEach(function (b) { var c = Math.max(prev, Number(g[b[0]]) || 0); out.push([b[0], b[1], c - prev]); prev = c; });
    out.push(["nothing", "Nada", 100 - prev]);
    return out;
  }
  function renderLoot(main) {
    main.appendChild(el("p", { class: "hint", text: "Chance por tentativa de drop. O jogo sorteia um número de 0 a 100 e dá o item mais raro cuja chance ainda seja maior ou igual ao número, então cada faixa vale a diferença para a faixa abaixo. Edite e salve para o Claude aplicar." }));
    var grid = el("div", { class: "loot-grid" });
    main.appendChild(grid);
    ["normal", "elite", "boss"].forEach(function (grade) {
      var g = get("loot", grade);
      if (!g) return;
      var draft = {};
      LOOT_FIELDS.forEach(function (f) { draft[f] = g[f]; });
      var card = el("section", { class: "loot-card" });
      var bar = el("div", { class: "bar", role: "img" });
      var legend = el("div", { class: "legend" });
      function paint() {
        bar.textContent = ""; legend.textContent = "";
        var odds = lootOdds(draft);
        bar.setAttribute("aria-label", odds.map(function (o) { return o[1] + " " + o[2].toFixed(1) + "%"; }).join(", "));
        odds.forEach(function (o) {
          if (o[2] > 0) bar.appendChild(el("span", { class: "c-" + o[0], style: "width:" + o[2] + "%" }));
          legend.appendChild(el("div", { class: "row" }, [el("i", { class: "c-" + o[0] }), el("span", { text: o[1] }), el("b", { text: o[2].toFixed(1) + "%" })]));
        });
      }
      var fields = el("div", { class: "fields" });
      BANDS.concat([["drops_min", "Tentativas mín."], ["drops_max", "Tentativas máx."], ["level_below", "Níveis abaixo"], ["level_above", "Níveis acima"]]).forEach(function (b) {
        fields.appendChild(el("label", { class: "f" }, [b[1] + (["drops_min", "drops_max", "level_below", "level_above"].indexOf(b[0]) < 0 ? " (chance)" : ""),
          el("input", { type: "number", step: "0.1", min: "0", max: "100", id: "loot-" + grade + "-" + b[0], value: draft[b[0]],
            oninput: function (e) { draft[b[0]] = Number(e.target.value); paint(); } })]));
      });
      ["gold_qty", "gold_qty_per_level"].forEach(function (k) {
        fields.appendChild(el("label", { class: "f" }, [k === "gold_qty" ? "Ouro (mín-máx)" : "Ouro por nível",
          el("input", { type: "text", id: "loot-" + grade + "-" + k, value: draft[k], oninput: function (e) { draft[k] = e.target.value; } })]));
      });
      fields.appendChild(el("label", { class: "f wide" }, ["Anotações para o Claude",
        el("textarea", { id: "loot-" + grade + "-notes", oninput: function (e) { draft.notes = e.target.value; } }, [draft.notes || ""])]));
      var msg = el("span", { class: "save-msg", "aria-live": "polite" });
      var save = el("button", { class: "btn primary", type: "button", text: "Salvar", onclick: function () {
        saveDoc("loot", grade, draft, LOOT_FIELDS, msg, save);
      } });
      card.appendChild(el("h3", {}, [GRADE[grade] || grade, g.pending ? el("span", { class: "dot", style: "position:static", text: "pendente" }) : null]));
      card.appendChild(bar);
      card.appendChild(legend);
      card.appendChild(fields);
      card.appendChild(el("div", { class: "actions" }, [save, msg]));
      if (state.readOnly) save.disabled = true;
      paint();
      grid.appendChild(card);
    });
  }

  // ---------------------------------------------------------------- drawer
  function closeDrawer() {
    $("drawer").hidden = true; $("scrim").hidden = true; state.open = null;
  }
  function openDrawer(build) {
    var d = $("drawer");
    d.textContent = "";
    build(d);
    d.hidden = false; $("scrim").hidden = false;
    var first = d.querySelector("input, select, textarea");
    if (first) first.focus();
  }
  function field(label, input, wide) { return el("label", { class: "f" + (wide ? " wide" : "") }, [label, input]); }
  function num(id, value, step) { return el("input", { type: "number", id: id, value: value == null ? "" : value, step: step || "1" }); }
  function txt(id, value) { return el("input", { type: "text", id: id, value: value == null ? "" : value }); }
  function sel(id, value, opts) {
    var s = el("select", { id: id });
    opts.forEach(function (o) { var opt = el("option", { value: o[0], text: o[1] }); if (String(o[0]) === String(value)) opt.selected = true; s.appendChild(opt); });
    return s;
  }

  function bonusEditor(prefix, value, keys) {
    var list = parseBonuses(value);
    var wrap = el("div", { class: "bonus-list" });
    function draw() {
      wrap.textContent = "";
      list.forEach(function (b, i) {
        var s = sel(prefix + "-k-" + i, b.k, keys.map(function (k) { return [k, STAT[k] || k]; }));
        s.addEventListener("change", function () { b.k = s.value; });
        var v = el("input", { type: "number", id: prefix + "-v-" + i, value: b.v, oninput: function (e) { b.v = Number(e.target.value); } });
        wrap.appendChild(el("div", { class: "bonus-row" }, [s, v, el("button", { type: "button", "aria-label": "Remover", text: "×",
          onclick: function () { list.splice(i, 1); draw(); } })]));
      });
      wrap.appendChild(el("button", { class: "add-bonus", type: "button", text: "+ adicionar", onclick: function () { list.push({ k: keys[0], v: 1 }); draw(); } }));
    }
    draw();
    return { node: wrap, value: function () { return fmtBonuses(list); } };
  }

  function openItem(id) {
    var it = get("items", id);
    state.open = ["items", id];
    openDrawer(function (d) {
      d.appendChild(el("div", { class: "drawer-head" }, [
        el("span", { class: "slot" }, [el("span", { class: "icon", style: iconStyle(it.icon) })]),
        el("div", {}, [el("h2", { id: "drawer-title", text: it.name_pt || it.name }), el("div", { class: "sub", text: "#" + it.id + " · " + it.type + (it.two_handed ? " · duas mãos" : "") })]),
        el("button", { class: "close", type: "button", "aria-label": "Fechar", text: "×", onclick: closeDrawer })
      ]));
      var f = {
        name: txt("it-name", it.name), name_pt: txt("it-name_pt", it.name_pt),
        level: num("it-level", it.level), band: sel("it-band", it.band, Object.keys(BAND).map(function (k) { return [k, BAND[k]]; })),
        price: num("it-price", it.price), tint: sel("it-tint", it.tint, TINTS.map(function (t) { return [t, t || "sem filtro"]; })),
        notes: el("textarea", { id: "it-notes" }, [it.notes || ""])
      };
      var stats = el("div", { class: "fields" });
      if (it.dmg_min != null) {
        f.dmg_min = num("it-dmg_min", it.dmg_min); f.dmg_max = num("it-dmg_max", it.dmg_max);
        stats.appendChild(field("Dano mín. (" + (DMG[it.dmg_type] || it.dmg_type) + ")", f.dmg_min));
        stats.appendChild(field("Dano máx.", f.dmg_max));
      }
      if (it.abs_min != null) {
        f.abs_min = num("it-abs_min", it.abs_min); f.abs_max = num("it-abs_max", it.abs_max);
        stats.appendChild(field("Armadura mín.", f.abs_min));
        stats.appendChild(field("Armadura máx.", f.abs_max));
      }
      stats.appendChild(field("Nível (requisito)", f.level));
      stats.appendChild(field("Raridade", f.band));
      stats.appendChild(field("Preço", f.price));
      stats.appendChild(field("Filtro de cor", f.tint));
      var bonus = bonusEditor("it-bonus", it.bonuses, Object.keys(STAT).filter(function (k) { return ["undead", "demon", "greenskin", "beast"].indexOf(k) < 0; }));
      var slayer = bonusEditor("it-slayer", it.slayer, ["undead", "demon", "greenskin", "beast"]);
      var allowed = (it.classes || "").split(";").filter(Boolean);
      var classBoxes = CLASSES.map(function (c) {
        var box = el("input", { type: "checkbox", id: "it-class-" + c[0] });
        box.checked = !allowed.length || allowed.indexOf(c[0]) >= 0;
        return { id: c[0], box: box, node: el("label", { class: "f", style: "grid-auto-flow:column;justify-content:start;align-items:center;gap:6px" }, [box, c[1]]) };
      });
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Nome" }), el("div", { class: "fields" }, [field("Inglês (msgid)", f.name), field("Português", f.name_pt)])]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Status" }), stats]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Bônus" }), bonus.node]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Dano extra contra (matador)" }), slayer.node]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Classes que podem usar" }), el("div", { class: "fields" }, classBoxes.map(function (c) { return c.node; }))]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Anotações para o Claude" }), field("Pedidos que não cabem nos campos (\"deixar mais raro\", \"trocar o ícone\")", f.notes, true)]));
      d.appendChild(el("div", { class: "readonly" }, [el("span", { text: "Base: " + it.base }), el("span", { text: "Bônus em texto: " + (it.bonuses || "—") })]));
      footer(d, "items", id, ITEM_FIELDS, function () {
        var out = {};
        ["name", "name_pt", "band", "tint", "notes"].forEach(function (k) { out[k] = f[k].value; });
        ["level", "price", "dmg_min", "dmg_max", "abs_min", "abs_max"].forEach(function (k) { out[k] = f[k] ? Number(f[k].value) : it[k]; });
        out.bonuses = bonus.value();
        out.slayer = slayer.value();
        var picked = classBoxes.filter(function (c) { return c.box.checked; }).map(function (c) { return c.id; });
        out.classes = picked.length === CLASSES.length ? "" : picked.join(";");
        return out;
      });
    });
  }

  function openEnemy(id) {
    var e = get("enemies", id);
    state.open = ["enemies", id];
    openDrawer(function (d) {
      d.appendChild(el("div", { class: "drawer-head" }, [
        el("span", { class: "slot portrait-slot" }, [el("span", { class: "portrait", style: portraitStyle(e.portrait) })]),
        el("div", {}, [el("h2", { id: "drawer-title", text: e.name_pt || e.name }), el("div", { class: "sub", text: e.family + " · modelo " + (e.template || "—") })]),
        el("button", { class: "close", type: "button", "aria-label": "Fechar", text: "×", onclick: closeDrawer })
      ]));
      if (!e.editable) {
        d.appendChild(el("p", { class: "hint", text: "O boneco de treino é fixo (enemies/rd_dummy.txt) e não é editado por aqui." }));
        return;
      }
      var f = {
        name: txt("en-name", e.name), name_pt: txt("en-name_pt", e.name_pt),
        ek_level: num("en-ek_level", e.ek_level), grade: sel("en-grade", e.grade, Object.keys(GRADE).map(function (k) { return [k, GRADE[k]]; })),
        hp_mult: num("en-hp_mult", e.hp_mult, "0.05"), dmg_mult: num("en-dmg_mult", e.dmg_mult, "0.05"),
        tint: sel("en-tint", e.tint, TINTS.map(function (t) { return [t, t || "sem filtro"]; })),
        notes: el("textarea", { id: "en-notes" }, [e.notes || ""])
      };
      var resist = bonusEditor("en-res", e.resists, RESIST);
      var lvl = el("input", { type: "range", id: "en-preview-level", min: "1", max: "30", value: "5", "aria-label": "Nível da prévia" });
      var prev = el("div", { class: "preview" });
      function paint() {
        var probe = Object.assign({}, e, { hp_mult: Number(f.hp_mult.value) || 0, dmg_mult: Number(f.dmg_mult.value) || 0 });
        var L = Number(lvl.value), s = enemyAt(probe, L);
        prev.textContent = "";
        prev.appendChild(el("div", { class: "row" }, [el("span", { text: "Nível " + L }), el("span", { text: "" })]));
        prev.appendChild(lvl);
        prev.appendChild(el("div", { class: "row" }, [el("span", { text: "Vida" }), el("b", { text: String(s.hp) })]));
        prev.appendChild(el("div", { class: "row" }, [el("span", { text: "Dano" }), el("b", { text: s.dmin + "–" + s.dmax })]));
        prev.appendChild(el("div", { class: "row" }, [el("span", { text: "Absorção" }), el("b", { text: e.base_absorb_min + "–" + e.base_absorb_max })]));
      }
      lvl.addEventListener("input", paint);
      f.hp_mult.addEventListener("input", paint);
      f.dmg_mult.addEventListener("input", paint);
      paint();
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Nome" }), el("div", { class: "fields" }, [field("Inglês (msgid)", f.name), field("Português", f.name_pt)])]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Força" }), el("div", { class: "fields" }, [
        field("Multiplicador de vida", f.hp_mult), field("Multiplicador de dano", f.dmg_mult),
        field("Tipo", f.grade), field("Nível no EK (faixa da horda)", f.ek_level), field("Filtro de cor", f.tint)])]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Prévia no jogo" }), prev]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Resistências" }), resist.node]));
      d.appendChild(el("fieldset", {}, [el("legend", { text: "Anotações para o Claude" }), field("Pedidos (\"dar ataque à distância\", \"mais rápido\")", f.notes, true)]));
      d.appendChild(el("div", { class: "readonly" }, [
        el("span", { text: "Modelo nv 1: vida " + e.base_hp + " (+" + e.base_hp_per_level + "/nv), dano " + e.base_dmg_min + "–" + e.base_dmg_max + " (+" + e.base_dmg_per_level + "/nv)" })]));
      footer(d, "enemies", id, ENEMY_FIELDS, function () {
        var out = {};
        ["name", "name_pt", "grade", "tint", "notes"].forEach(function (k) { out[k] = f[k].value; });
        ["ek_level", "hp_mult", "dmg_mult"].forEach(function (k) { out[k] = Number(f[k].value); });
        out.resists = resist.value();
        return out;
      });
    });
  }

  function footer(d, coll, id, fields, collect) {
    var msg = el("span", { class: "save-msg", "aria-live": "polite" });
    var save = el("button", { class: "btn primary", type: "button", text: "Salvar", onclick: function () { saveDoc(coll, id, collect(), fields, msg, save); } });
    var revert = el("button", { class: "btn", type: "button", text: "Voltar ao original", onclick: function () {
      var base = state.base[coll][id];
      var out = {}; fields.forEach(function (k) { out[k] = base[k]; });
      out.notes = "";
      saveDoc(coll, id, out, fields, msg, revert, true);
    } });
    if (state.readOnly || !state.dbReady) { save.disabled = true; revert.disabled = true; msg.textContent = "Somente leitura: abra no claude.ai para editar."; }
    d.appendChild(el("div", { class: "actions" }, [save, revert, msg]));
  }

  function saveDoc(coll, id, values, fields, msg, btn, isRevert) {
    if (!state.db) return;
    var base = state.base[coll][id] || {};
    var changed = fields.some(function (k) { return k !== "notes" && String(values[k]) !== String(base[k]); }) || !!values.notes;
    var body = {};
    fields.forEach(function (k) { body[k] = values[k]; });
    body.pending = changed;
    body.edited_at = new Date().toISOString();
    btn.disabled = true;
    msg.className = "save-msg"; msg.textContent = "Salvando…";
    state.db.collection(coll).doc(String(id)).update(body).then(function () {
      msg.textContent = isRevert ? "Voltou ao original." : (changed ? "Salvo. Fica pendente até o Claude aplicar." : "Salvo (igual ao original).");
      btn.disabled = false;
    }, function (err) {
      btn.disabled = false;
      msg.className = "save-msg err";
      if (err && err.code === "invalid_argument") { msg.textContent = "Sem permissão para editar esta página."; state.readOnly = true; }
      else msg.textContent = "Não foi possível salvar agora. Tente de novo em instantes.";
    });
  }

  // ---------------------------------------------------------------- frame
  function render() {
    var main = $("main");
    main.textContent = "";
    ["items", "enemies", "loot"].forEach(function (t) { $("tab-" + t).setAttribute("aria-selected", String(state.tab === t)); });
    $("count-items").textContent = rows("items").length || "";
    $("count-enemies").textContent = rows("enemies").length || "";
    var pending = ["items", "enemies", "loot"].reduce(function (n, c) { return n + rows(c).filter(function (r) { return r.pending; }).length; }, 0);
    var pill = $("pending-pill");
    pill.hidden = pending === 0;
    pill.textContent = pending + (pending === 1 ? " alteração pendente" : " alterações pendentes");
    pill.setAttribute("aria-pressed", String(state.pendingOnly));
    if (!pending) state.pendingOnly = false;
    if (state.tab === "items") renderItems(main);
    else if (state.tab === "enemies") renderEnemies(main);
    else renderLoot(main);
  }

  function setStatus(t) { $("status").textContent = t; }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { state.tab = b.getAttribute("data-tab"); state.q = ""; render(); });
  });
  $("pending-pill").addEventListener("click", function () { state.pendingOnly = !state.pendingOnly; render(); });
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });

  fetch("catalog.json").then(function (r) { return r.json(); }).then(function (cat) {
    cat.items.forEach(function (d) { state.base.items[d.id] = d; });
    cat.enemies.forEach(function (d) { state.base.enemies[d.id] = d; });
    cat.loot.forEach(function (d) { state.base.loot[d.grade] = d; });
    render();
    setStatus(state.dbReady ? "" : "Catálogo carregado. Conectando às edições…");
  }).catch(function () { setStatus("Não foi possível carregar o catálogo."); });

  var hasClaude = window.claude && typeof window.claude.use === "function";
  (hasClaude ? window.claude.use("db") : Promise.resolve(null)).then(function (db) {
    if (!db) { state.readOnly = true; setStatus("Somente leitura: as edições ficam disponíveis no claude.ai."); render(); return; }
    state.db = db;
    var seen = { items: false, enemies: false, loot: false };
    ["items", "enemies", "loot"].forEach(function (coll) {
      db.collection(coll).onSnapshot(function (snap) {
        var map = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (v) map[d.id] = v; });
        state.live[coll] = map;
        seen[coll] = true;
        state.dbReady = true;
        if (seen.items && seen.enemies && seen.loot) setStatus(Object.keys(state.live.items).length ? "Edições salvas para todos que abrirem a página." : "Banco vazio: mostrando o catálogo original.");
        var scroll = window.scrollY;
        var focusId = document.activeElement && document.activeElement.id;
        if ($("drawer").hidden) { render(); window.scrollTo(0, scroll); if (focusId && $(focusId)) $(focusId).focus(); }
        else { render(); }
      }, function () { setStatus("Conexão com as edições perdida. Recarregue a página."); });
    });
  });
})();
</script>
